<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not here — Scrollmark Open Source</title>
  <meta name="description" content="Claude Code skills for social media and short-form video — including the whole production pipeline — plus a hosted MCP server, from the team behind SocialGPT. MIT-licensed — clone and go." />
  <meta property="og:title" content="Scrollmark Open Source" />
  <meta property="og:description" content="Claude Code skills for social media and short-form video — including the whole production pipeline — plus a hosted MCP server, from the team behind SocialGPT." />
  
  
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://scrollmark.github.io/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://scrollmark.github.io/og-card.png" />
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16101f" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/brand-scrollmark.png" type="image/png" sizes="any" />

  <!-- Theme before first paint: stored choice, falling back to the OS -->
  <script>
    (() => {
      const stored = localStorage.getItem("theme");
      const mq = matchMedia("(prefers-color-scheme: dark)");
      const dark = stored ? stored === "dark" : mq.matches;
      document.documentElement.classList.toggle("dark", dark);
      mq.addEventListener("change", (e) => {
        if (!localStorage.getItem("theme")) {
          document.documentElement.classList.toggle("dark", e.matches);
        }
      });
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Shantell+Sans:wght@500&family=Fragment+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />

  <!-- Datastar — all interactivity on this page (https://data-star.dev,
       see https://data-star.dev/essays/why_another_framework) -->
  <!-- Every tab, OS variant and client panel on this site is a `data-show`
       element that starts at `display: none` and is revealed by Datastar. If
       Datastar never runs, thirteen of those sixteen blocks are unreachable —
       including the install commands. So say so in three ways that between
       them cover every way it can fail to run: the CDN being blocked or down
       (onerror), a browser that ignores ES modules (nomodule), and JS being
       off entirely (noscript). Any of them reveals all the panels at once,
       which is the correct degraded state: each is labelled by its own tab, so
       the page reads as a plain document listing every option. -->
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.0/bundles/datastar.js"
          onerror="document.documentElement.classList.add('no-ds')"></script>
  <script nomodule>document.documentElement.classList.add('no-ds')</script>
  <noscript><style>[data-show] { display: block !important }</style></noscript>
  <meta name="robots" content="noindex" />
</head>
<body id="top">
  <div class="paper-grain" aria-hidden="true"></div>
  <nav class="nav" aria-label="Main">
    <a class="brand" href="/">
      <img class="mark" src="/brand-scrollmark.png" alt="" />
      Scrollmark
      <span class="chip oss-tag sticker--lime" style="--tilt: 3deg">oss</span>
    </a>
    <div class="nav-links">
      <a href="/skills.html">Skills</a>
      <a href="/mcp.html">MCP</a>
      <a class="nav-optional" href="/index.html#about">About</a>
      <a class="nav-optional" href="https://github.com/scrollmark">GitHub</a>
    </div>
    <div
      class="theme-switch"
      role="radiogroup"
      aria-label="Theme"
      aria-orientation="horizontal"
      data-on:keydown="const order = ['system', 'light', 'dark']; const i = order.indexOf($theme); let next = -1; if (evt.key === 'ArrowRight' || evt.key === 'ArrowDown') next = (i + 1) % 3; if (evt.key === 'ArrowLeft' || evt.key === 'ArrowUp') next = (i + 2) % 3; if (evt.key === 'Home') next = 0; if (evt.key === 'End') next = 2; if (next >= 0) { evt.preventDefault(); document.documentElement.classList.add('theme-fade'); $theme = order[next]; el.querySelectorAll('button')[next].focus(); setTimeout(() => document.documentElement.classList.remove('theme-fade'), 350) }"
      data-class:pos-light="$theme === 'light'"
      data-class:pos-dark="$theme === 'dark'"
    >
      <button type="button" role="radio" aria-label="System theme"
        data-attr:aria-checked="$theme === 'system' ? 'true' : 'false'"
        data-attr:tabindex="$theme === 'system' ? '0' : '-1'"
        data-on:click="document.documentElement.classList.add('theme-fade'); $theme = 'system'; setTimeout(() => document.documentElement.classList.remove('theme-fade'), 350)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8.5 20h7M12 16.5V20"/></svg>
      </button>
      <button type="button" role="radio" aria-label="Light theme"
        data-attr:aria-checked="$theme === 'light' ? 'true' : 'false'"
        data-attr:tabindex="$theme === 'light' ? '0' : '-1'"
        data-on:click="document.documentElement.classList.add('theme-fade'); $theme = 'light'; setTimeout(() => document.documentElement.classList.remove('theme-fade'), 350)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.4" fill="currentColor" stroke="none"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>
      </button>
      <button type="button" role="radio" aria-label="Dark theme"
        data-attr:aria-checked="$theme === 'dark' ? 'true' : 'false'"
        data-attr:tabindex="$theme === 'dark' ? '0' : '-1'"
        data-on:click="document.documentElement.classList.add('theme-fade'); $theme = 'dark'; setTimeout(() => document.documentElement.classList.remove('theme-fade'), 350)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 14.4A8.8 8.8 0 0 1 9.6 3.4a8.8 8.8 0 1 0 11 11z" fill="currentColor"/></svg>
      </button>
    </div>
  </nav>
  <main>
    <header class="hero">
      <div class="wrap">
        <p class="eyebrow">404</p>
        <h1 class="display">That page isn't <span class="marker">on the shelf</span>.</h1>
        <p class="sub">
          The link may be old, or we may have moved something. Everything this
          site has lives on three pages:
        </p>
        <div class="hero-ctas">
          <a class="btn btn--primary" href="/skills.html">Social Skills</a>
          <a class="btn btn--secondary" href="/mcp.html">SocialGPT MCP</a>
          <a class="btn btn--secondary" href="/">Home</a>
        </div>
      </div>
    </header>
  </main>
</body>
</html>
