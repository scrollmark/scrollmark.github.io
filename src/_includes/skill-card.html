          <article class="card {{ s.colour }}" style="--tilt: {{ s.tilt }}">
            <p class="eyebrow">{{ s.eyebrow }}</p>
            <h4 class="heading-3 skill-name">
              {{ s.icon }}
              {{ s.slug }}
            </h4>
            <p>
              {{ s.blurb }}
            </p>
            <span class="skill-when"><strong>Reach for it</strong> {{ s.when }}</span>
{%- if s.chipRow %}
            {{ s.chipRow }}
{%- endif %}
            <div class="codebox codebox--row">
              <button class="copy-btn" type="button" aria-label="Copy {{ s.slug }} install command"
                data-on:click="navigator.clipboard.writeText(document.getElementById('cmd-{{ s.copyId }}').innerText); $copied = '{{ s.copyId }}'; setTimeout(() => { $copied = '' }, 1500)">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span data-text="$copied === '{{ s.copyId }}' ? 'Copied' : 'Copy'">Copy</span>
              </button>
              <pre><code id="cmd-{{ s.copyId }}">npx skills add scrollmark/social-skills -s {{ s.slug }}</code></pre>
            </div>
          </article>
